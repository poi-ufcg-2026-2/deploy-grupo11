services:
  cpu-bound:
    image: rayanne9/image-restoration:1.0
    container_name: cpu-bound-grupo11
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      THREADS: "1"
      METRICS_INTERVAL_S: "5"
    volumes:
      - type: bind
        source: /mnt/poi-grupo11/cpu-bound/logs
        target: /logs
    deploy:
      resources:
        limits:
          memory: 512M

  memory-bound:
    image: csabrina/ramdex-api:1.0
    container_name: memory-bound-grupo11
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - type: bind
        source: /mnt/poi-grupo11/memory-bound/logs
        target: /logs
    deploy:
      resources:
        limits:
          memory: 800M
